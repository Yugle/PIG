<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PIG Robot OTA</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #0f1117; color: #e5e7eb; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
    .card { background: #181b24; border: 1px solid #2a2f3d; border-radius: 16px; padding: 28px 32px; max-width: 420px; width: 90%; box-shadow: 0 12px 32px rgba(0,0,0,0.4); }
    h1 { font-size: 20px; margin: 0 0 8px; color: #fff; }
    .ver { display: inline-block; background: #2563eb; color: #fff; font-weight: 600; font-size: 13px; padding: 4px 10px; border-radius: 999px; margin-bottom: 16px; }
    .log { background: #11131a; border-radius: 10px; padding: 14px; font-size: 14px; line-height: 1.6; color: #cbd5e1; }
    .meta { margin-top: 14px; font-size: 12px; color: #64748b; }
    a { color: #60a5fa; text-decoration: none; }
  </style>
</head>
<body>
  <div class="card">
    <h1>PIG 桌面机器人 OTA</h1>
    <div id="ver" class="ver">加载中...</div>
    <div id="log" class="log">正在读取版本信息...</div>
    <div class="meta">接口地址：<a href="/version.json">/version.json</a></div>
  </div>
  <script>
    fetch('/version.json?t=' + Date.now())
      .then(r => r.json())
      .then(d => {
        document.getElementById('ver').textContent = d.latest_version || 'unknown';
        document.getElementById('log').textContent = d.changelog || '暂无更新说明';
      })
      .catch(() => {
        document.getElementById('ver').textContent = '获取失败';
      });
  </script>
</body>
</html>
