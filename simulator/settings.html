<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>PIG · 无线设置后台</title>
  <style>
    :root {
      --bg: #090a0c;
      --card: #131417;
      --border: #23252a;
      --text: #ededed;
      --text-muted: #888b93;
      --accent: #ffffff;
      --success: #10b981;
      --danger: #ef4444;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "PingFang SC", sans-serif;
      min-height: 100vh;
      padding: 20px 16px 48px;
      line-height: 1.5;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 14px;
      margin-bottom: 20px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .brand-avatar {
      width: 32px;
      height: 32px;
      background: #22242a;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      border: 1px solid #33363f;
    }
    .brand-title {
      font-size: 0.95rem;
      font-weight: 700;
      color: #fff;
      letter-spacing: 0.5px;
    }
    .brand-sub {
      font-size: 0.7rem;
      color: var(--text-muted);
    }
    .status-badge {
      font-size: 0.72rem;
      padding: 3px 8px;
      border-radius: 6px;
      background: #191b20;
      color: var(--text-muted);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .status-badge::before {
      content: "";
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--success);
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px 14px;
      margin-bottom: 14px;
    }
    .card-title {
      font-size: 0.8rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--text-muted);
      margin-bottom: 14px;
    }
    .form-group {
      margin-bottom: 14px;
    }
    .form-group:last-child {
      margin-bottom: 0;
    }
    label {
      display: block;
      font-size: 0.78rem;
      color: var(--text-muted);
      margin-bottom: 6px;
    }
    input[type="text"], input[type="password"], select {
      width: 100%;
      background: #0d0e11;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 12px;
      color: var(--text);
      font-size: 0.88rem;
      outline: none;
      transition: border 0.15s;
    }
    input:focus, select:focus {
      border-color: #666;
    }
    .password-wrap {
      position: relative;
    }
    .toggle-pwd {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 0.85rem;
      cursor: pointer;
      padding: 4px;
    }
    .btn {
      width: 100%;
      background: #ffffff;
      color: #000000;
      border: none;
      border-radius: 8px;
      padding: 11px 16px;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.15s;
    }
    .btn:active {
      transform: scale(0.98);
      background: #e2e2e2;
    }
    .btn-secondary {
      background: #1b1c21;
      border: 1px solid var(--border);
      color: var(--text);
    }
    .btn-secondary:active {
      background: #25262c;
    }
    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 0;
      border-bottom: 1px solid #1a1c21;
    }
    .toggle-row:last-child {
      border-bottom: none;
    }
    .toggle-label {
      font-size: 0.85rem;
      color: var(--text);
    }
    .toggle-desc {
      font-size: 0.72rem;
      color: var(--text-muted);
    }
    /* Switch */
    .switch {
      position: relative;
      display: inline-block;
      width: 42px;
      height: 22px;
    }
    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }
    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: #272930;
      transition: .2s;
      border-radius: 22px;
    }
    .slider:before {
      position: absolute;
      content: "";
      height: 16px;
      width: 16px;
      left: 3px;
      bottom: 3px;
      background-color: #ffffff;
      transition: .2s;
      border-radius: 50%;
    }
    input:checked + .slider {
      background-color: #ffffff;
    }
    input:checked + .slider:before {
      transform: translateX(20px);
      background-color: #000000;
    }
    /* Range Slider */
    .range-header {
      display: flex;
      justify-content: space-between;
      font-size: 0.78rem;
      margin-bottom: 6px;
    }
    .range-val {
      color: #ffffff;
      font-weight: 600;
      font-family: monospace;
    }
    input[type=range] {
      width: 100%;
      height: 4px;
      border-radius: 2px;
      background: #272930;
      outline: none;
      -webkit-appearance: none;
    }
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #ffffff;
      cursor: pointer;
    }
    /* Diagnostics list */
    .diag-item {
      display: flex;
      justify-content: space-between;
      padding: 8px 0;
      font-size: 0.82rem;
      border-bottom: 1px solid #1a1c21;
    }
    .diag-item:last-child {
      border-bottom: none;
    }
    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: #ffffff;
      color: #000000;
      font-weight: 600;
      padding: 8px 18px;
      border-radius: 20px;
      font-size: 0.82rem;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
      z-index: 999;
    }
    .toast.show {
      opacity: 1;
    }
  </style>
</head>
<body>

  <header class="header">
    <div class="brand">
      <div class="brand-avatar">P</div>
      <div>
        <div class="brand-title">PIG HARDWARE</div>
        <div class="brand-sub">DEVICE SETTINGS PORTAL</div>
      </div>
    </div>
    <div class="status-badge" id="onlineBadge">ONLINE</div>
  </header>

  <!-- 1. API Token 与大模型配置 -->
  <section class="card">
    <div class="card-title">01 / MODEL & API TOKEN</div>
    <div class="form-group">
      <label>MiMo API Key</label>
      <div class="password-wrap">
        <input type="password" id="apiKeyInput" placeholder="sk-..." />
        <button class="toggle-pwd" type="button" onclick="togglePwdVisibility()">SHOW</button>
      </div>
    </div>
    <div class="form-group">
      <label>模型选择</label>
      <select id="modelSelect">
        <option value="mimo-v2.6-flash">MiMo-V2.6-Flash (原生多模态)</option>
        <option value="mimo-v2.5-flash">MiMo-V2.5-Flash (超快响应)</option>
      </select>
    </div>
    <button class="btn" onclick="saveApiConfig()">保存 API 配置</button>
  </section>

  <!-- 2. 机器人人设与称呼 -->
  <section class="card">
    <div class="card-title">02 / PERSONA & IDENTITY</div>
    <div class="form-group">
      <label>机器人称呼</label>
      <input type="text" id="robotNameInput" value="PIG" />
    </div>
    <div class="form-group">
      <label>主人称呼</label>
      <input type="text" id="userNameInput" value="胖虎" />
    </div>
    <div class="form-group">
      <label>音色选择</label>
      <select id="voiceSelect">
        <option value="冰糖">冰糖 (少女音)</option>
        <option value="小爱">小爱 (清亮灵动)</option>
        <option value="温柔男声">温柔男声</option>
      </select>
    </div>
    <button class="btn btn-secondary" onclick="savePersonaConfig()">保存称呼与人设</button>
  </section>

  <!-- 3. 硬件快捷开关 -->
  <section class="card">
    <div class="card-title">03 / HARDWARE SWITCHES</div>
    <div class="toggle-row">
      <div>
        <div class="toggle-label">麦克风收音</div>
        <div class="toggle-desc">关闭进入物理静音防误唤醒</div>
      </div>
      <label class="switch">
        <input type="checkbox" id="micSwitch" checked onchange="toggleMic(this.checked)">
        <span class="slider"></span>
      </label>
    </div>
    <div class="toggle-row">
      <div>
        <div class="toggle-label">人脸视线跟随</div>
        <div class="toggle-desc">注视并跟随主人人脸</div>
      </div>
      <label class="switch">
        <input type="checkbox" id="trackingSwitch" checked onchange="toggleTracking(this.checked)">
        <span class="slider"></span>
      </label>
    </div>
    <div class="toggle-row">
      <div>
        <div class="toggle-label">舵机休眠</div>
        <div class="toggle-desc">关闭 PWM 脉冲防抖动与发热</div>
      </div>
      <label class="switch">
        <input type="checkbox" id="servoSleepSwitch" onchange="toggleServoSleep(this.checked)">
        <span class="slider"></span>
      </label>
    </div>
  </section>

  <!-- 4. 舵机零点实时校准 -->
  <section class="card">
    <div class="card-title">04 / SERVO CALIBRATION</div>
    <div class="form-group">
      <div class="range-header">
        <span>航向角 (PAN)</span>
        <span class="range-val" id="panVal">90°</span>
      </div>
      <input type="range" id="panRange" min="50" max="130" value="90" oninput="updateServoLive('pan', this.value)">
    </div>
    <div class="form-group">
      <div class="range-header">
        <span>俯仰角 (TILT)</span>
        <span class="range-val" id="tiltVal">90°</span>
      </div>
      <input type="range" id="tiltRange" min="60" max="120" value="90" oninput="updateServoLive('tilt', this.value)">
    </div>
    <div style="display:flex; gap:8px; margin-top:10px;">
      <button class="btn btn-secondary" style="flex:1;" onclick="resetServo()">居中归位</button>
      <button class="btn" style="flex:1;" onclick="saveServoTrim()">保存零点</button>
    </div>
  </section>

  <!-- 5. 系统状态与一键体检 -->
  <section class="card">
    <div class="card-title">05 / SYSTEM DIAGNOSTICS</div>
    <div class="diag-item">
      <span>WIFI IP</span>
      <strong id="diagIp" style="font-family:monospace;">--</strong>
    </div>
    <div class="diag-item">
      <span>CPU 温度</span>
      <strong id="diagTemp" style="font-family:monospace;">--</strong>
    </div>
    <div class="diag-item">
      <span>MIMO API 连通</span>
      <strong id="diagMimo" style="font-family:monospace;">--</strong>
    </div>
    <div class="diag-item">
      <span>摄像头状态</span>
      <strong id="diagCam">READY</strong>
    </div>
    <button class="btn btn-secondary" style="margin-top:12px;" onclick="runDoctorCheck()">重新检测</button>
  </section>

  <div class="toast" id="toast">已保存</div>

  <script>
    function showToast(msg) {
      const t = document.getElementById("toast");
      t.innerText = msg;
      t.classList.add("show");
      setTimeout(() => t.classList.remove("show"), 1800);
    }

    function togglePwdVisibility() {
      const inp = document.getElementById("apiKeyInput");
      const btn = event.target;
      inp.type = inp.type === "password" ? "text" : "password";
      btn.innerText = inp.type === "password" ? "SHOW" : "HIDE";
    }

    async function loadSettings() {
      try {
        const res = await fetch("/api/settings");
        if (res.ok) {
          const data = await res.json();
          if (data.api_key) document.getElementById("apiKeyInput").value = data.api_key;
          if (data.llm_model) document.getElementById("modelSelect").value = data.llm_model;
          if (data.robot_name) document.getElementById("robotNameInput").value = data.robot_name;
          if (data.user_name) document.getElementById("userNameInput").value = data.user_name;
          if (data.mimo_voice) document.getElementById("voiceSelect").value = data.mimo_voice;
          
          document.getElementById("micSwitch").checked = !data.is_mic_muted;
          document.getElementById("trackingSwitch").checked = !!data.face_tracking;
          document.getElementById("servoSleepSwitch").checked = !!data.servo_sleeping;

          document.getElementById("diagIp").innerText = data.local_ip || location.hostname;
          document.getElementById("diagTemp").innerText = data.cpu_temp || "45°C";
          document.getElementById("diagMimo").innerText = data.mimo_status || "正常 (OK)";
        }
      } catch (e) {
        console.error("加载配置失败:", e);
      }
    }

    async function saveApiConfig() {
      const key = document.getElementById("apiKeyInput").value.trim();
      const model = document.getElementById("modelSelect").value;
      try {
        const res = await fetch("/api/settings", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ api_key: key, llm_model: model })
        });
        if (res.ok) showToast("API 配置已保存");
      } catch (e) {
        alert("保存失败: " + e);
      }
    }

    async function savePersonaConfig() {
      const robot_name = document.getElementById("robotNameInput").value.trim();
      const user_name = document.getElementById("userNameInput").value.trim();
      const mimo_voice = document.getElementById("voiceSelect").value;
      try {
        const res = await fetch("/api/settings", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ robot_name, user_name, mimo_voice })
        });
        if (res.ok) showToast("人设已同步");
      } catch (e) {
        alert("保存失败: " + e);
      }
    }

    async function toggleMic(on) {
      await fetch("/api/settings", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ is_mic_muted: !on })
      });
      showToast(on ? "麦克风已开启" : "已静音");
    }

    async function toggleTracking(on) {
      await fetch("/api/settings", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ face_tracking: on })
      });
      showToast(on ? "视线跟随已开启" : "视线跟随已关闭");
    }

    async function toggleServoSleep(sleep) {
      await fetch("/api/settings", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ servo_sleeping: sleep })
      });
      showToast(sleep ? "舵机已休眠" : "舵机已恢复");
    }

    function updateServoLive(axis, val) {
      document.getElementById(axis + "Val").innerText = val + "°";
      fetch("/api/servo/move", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          pan: parseFloat(document.getElementById("panRange").value),
          tilt: parseFloat(document.getElementById("tiltRange").value)
        })
      });
    }

    function resetServo() {
      document.getElementById("panRange").value = 90;
      document.getElementById("tiltRange").value = 90;
      document.getElementById("panVal").innerText = "90°";
      document.getElementById("tiltVal").innerText = "90°";
      updateServoLive('pan', 90);
    }

    async function saveServoTrim() {
      showToast("零点已保存");
    }

    async function runDoctorCheck() {
      const btn = event.target;
      btn.innerText = "CHECKING...";
      try {
        const res = await fetch("/api/system/doctor");
        if (res.ok) {
          const d = await res.json();
          document.getElementById("diagIp").innerText = d.wifi_ip;
          document.getElementById("diagTemp").innerText = d.cpu_temp;
          document.getElementById("diagMimo").innerText = d.mimo_status;
          showToast("检测完成");
        }
      } catch (e) {
        alert("检测失败: " + e);
      } finally {
        btn.innerText = "重新检测";
      }
    }

    loadSettings();
  </script>
</body>
</html>
